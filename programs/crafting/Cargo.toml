[package]
name = "crafting"
version = "0.1.0"
description = "Crafting — burns resource tokens and mints item NFTs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "crafting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang       = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl        = { version = "0.31.0", features = ["token_2022"] }
resource_manager  = { path = "../resource_manager", features = ["cpi"] }
item_nft          = { path = "../item_nft",          features = ["cpi"] }
