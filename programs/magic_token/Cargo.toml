[package]
name = "magic_token"
version = "0.1.0"
description = "MagicToken — SPL Token-2022 game currency minted only via Marketplace"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "magic_token"
test = false

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022"] }
solana-program = "=2.2.1"
spl-token-2022 = { version = "8", features = ["no-entrypoint"] }
spl-token-metadata-interface = "0.7"
spl-type-length-value = "0.8"
