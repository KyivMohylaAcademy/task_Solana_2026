[package]
name = "search"
version = "0.1.0"
description = "Search — resource search with 60-second on-chain timer"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "search"
test = false

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022"] }
solana-program = "=2.2.1"
solana-keccak-hasher = "=2.2.1"
resource_manager = { path = "../resource_manager", features = ["cpi"] }
