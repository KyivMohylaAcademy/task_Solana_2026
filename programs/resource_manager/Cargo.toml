[package]
name = "resource_manager"
version = "0.1.0"
description = "Resource Manager — manages SPL Token-2022 resource mints for Cossack Business"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "resource_manager"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang   = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl    = { version = "0.31.0", features = ["token_2022", "token_2022_extensions"] }
spl-token-2022 = { version = "4.0.0", features = ["no-entrypoint"] }
