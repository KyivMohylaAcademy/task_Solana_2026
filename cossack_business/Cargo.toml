[workspace]
members = [
    "programs/resource_manager",
    "programs/magic_token",
    "programs/item_nft",
    "programs/search",
    "programs/crafting",
    "programs/marketplace",
]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "associated_token"] }
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "3.0.4", features = ["no-entrypoint"] }
mpl-token-metadata = "4.1.2"
solana-program = "1.18.26"

[patch.crates-io]
anchor-syn = { path = "patches/anchor-syn-0.30.1" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
