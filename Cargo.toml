[workspace]
members = [
    "programs/resource_manager",
    "programs/magic_token",
    "programs/item_nft",
    "programs/crafting",
    "programs/search",
    "programs/marketplace",
]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", features = ["token_2022", "token_2022_extensions", "metadata"] }
mpl-token-metadata = { version = "5.1.2-alpha.2" }

[profile.release]
overflow-checks = true
lto = "fat"
opt-level = 3
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
